name: Web checks
on:
  push:
    paths: ["apps/web/**", ".github/workflows/web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/web
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Database tests create and drop their own databases here.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/stash_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser tests
        run: |
          psql "$TEST_DATABASE_URL" -c "create database stash_e2e"
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-browser-tests
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
