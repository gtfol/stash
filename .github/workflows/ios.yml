name: iPhone build and tests
on:
  push:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: apps/ios
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Core unit tests on macOS
        run: swift test
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      STASH_RESULT_BUNDLE: TestResults.xcresult
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- Stash.xcodeproj Stash/Stash.entitlements StashShare/StashShare.entitlements
      - name: Build simulator and device, test on iPhone simulator
        run: scripts/test-ios.sh
      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          if [ -d TestResults.xcresult ]; then xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Screenshots; fi
          swift scripts/make-icon.swift Screenshots/AppIcon-rendered.png
      - name: Print screenshots for review
        if: always()
        # Downscaled JPEGs as base64 between markers, readable from the job log.
        run: |
          [ -f Screenshots/manifest.json ] && cat Screenshots/manifest.json
          mkdir -p Review
          for file in Screenshots/*.png Screenshots/*.jpg Screenshots/*.jpeg; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            if [ "$name" = "AppIcon-rendered.png" ]; then cp "$file" "Review/$name"; else sips -Z 900 -s format jpeg -s formatOptions 70 "$file" --out "Review/${name%.*}.jpg" >/dev/null; fi
          done
          for file in Review/*; do
            [ -f "$file" ] || continue
            echo "=== BEGIN $(basename "$file")"
            base64 -i "$file" -b 76
            echo "=== END $(basename "$file")"
          done
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: apps/ios/Screenshots
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore
