name: iPhone build and tests
on:
  push:
    paths: ["apps/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
defaults:
  run:
    working-directory: apps/ios
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Core unit tests on macOS
        run: swift test
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      STASH_RESULT_BUNDLE: TestResults.xcresult
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated Xcode project
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- Stash.xcodeproj Stash/Stash.entitlements StashShare/StashShare.entitlements
      - name: Build simulator and device, test on iPhone simulator
        run: scripts/test-ios.sh
      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p Screenshots
          if [ -d TestResults.xcresult ]; then xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Screenshots; fi
          swift scripts/make-icon.swift Screenshots/AppIcon-rendered.png
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screenshots
          path: apps/ios/Screenshots
          if-no-files-found: ignore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: apps/ios/TestResults.xcresult
          if-no-files-found: ignore
      - name: Print screenshots for review
        if: always()
        # Small quantized PNGs as base64 between markers, most important last, so they can be read
        # from the end of this log. Also compares the CoreText icon with the committed one.
        run: |
          python3 -m venv /tmp/review >/dev/null && /tmp/review/bin/pip install -q pillow
          /tmp/review/bin/python - <<'PY'
          import base64, io, json, pathlib
          from PIL import Image, ImageChops, ImageStat
          root = pathlib.Path('Screenshots')
          icon, committed = root / 'AppIcon-rendered.png', pathlib.Path('Stash/Assets.xcassets/AppIcon.appiconset/AppIcon.png')
          if icon.exists():
              a, b = Image.open(icon).convert('L'), Image.open(committed).convert('L')
              ink = lambda im: im.point(lambda v: 255 if v > 128 else 0).getbbox()
              print('icon sizes', a.size, b.size, 'mean diff', round(ImageStat.Stat(ImageChops.difference(a, b)).mean[0], 3),
                    'ink rendered', ink(a), 'ink committed', ink(b))
          names = {}
          def walk(node):
              if isinstance(node, dict):
                  if 'exportedFileName' in node: names[node['exportedFileName']] = node.get('suggestedHumanReadableName', node['exportedFileName'])
                  for value in node.values(): walk(value)
              elif isinstance(node, list):
                  for value in node: walk(value)
          if (root / 'manifest.json').exists(): walk(json.load(open(root / 'manifest.json')))
          shots = sorted(((names.get(p.name, p.name), p) for p in root.iterdir() if p.suffix.lower() in ('.png', '.jpg', '.jpeg') and p.name != icon.name), reverse=True)
          for name, path in shots:
              image = Image.open(path).convert('RGB')
              image.thumbnail((402, 900))
              buffer = io.BytesIO()
              image.quantize(colors=24).save(buffer, 'PNG', optimize=True)
              data = base64.b64encode(buffer.getvalue()).decode()
              print(f'=== BEGIN {name} {image.size} {len(buffer.getvalue())} bytes')
              for i in range(0, len(data), 100): print(data[i:i + 100])
              print(f'=== END {name}')
          PY
      - name: Test summary
        if: always()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact
          xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact | python3 -c '
          import json, sys
          def walk(node, suite=""):
              if node.get("nodeType") == "Test Case":
                  print(node.get("result"), suite + "/" + node.get("name", ""), node.get("duration", ""))
              for child in node.get("children", []):
                  walk(child, node.get("name", suite) if node.get("nodeType") == "Test Suite" else suite)
          for node in json.load(sys.stdin).get("testNodes", []): walk(node)
          '
